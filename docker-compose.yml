# =============================================================================
# ZED_BOT - Docker Compose foundation
#
# Configuration comes from .env in this directory (created by
# scripts/install.sh; see .env.example for the expected keys).
# Persistent state lives outside the containers in ${ZEDBOT_DATA_DIR}
# (default /opt/zedbot/data) so images can be rebuilt freely.
# =============================================================================

name: zedbot

services:
  postgres:
    image: postgres:16-alpine
    container_name: zedbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zedbot}
      POSTGRES_USER: ${POSTGRES_USER:-zedbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - ${ZEDBOT_DATA_DIR:-/opt/zedbot/data}/postgres:/var/lib/postgresql/data
    healthcheck:
      # Probe TCP, not the unix socket: the image's init-time temporary
      # server (listen_addresses='') answers the socket, which would mark the
      # container healthy before port 5432 actually accepts connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-zedbot} -d ${POSTGRES_DB:-zedbot}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - zedbot

  redis:
    image: redis:7-alpine
    container_name: zedbot-redis
    restart: unless-stopped
    # The password is written to a config file at startup (printf is a shell
    # builtin) instead of being passed as --requirepass, so it never appears
    # in a process argv or in the container's recorded command. Re-entering
    # docker-entrypoint.sh keeps the image's drop-to-redis-user behaviour.
    command:
      - sh
      - -c
      - >-
        printf 'requirepass %s\nappendonly yes\n' "$$REDIS_PASSWORD" > /run/redis.conf &&
        chown redis:redis /run/redis.conf && chmod 600 /run/redis.conf &&
        exec docker-entrypoint.sh redis-server /run/redis.conf
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      # Lets healthchecks and `zedbot doctor` authenticate without putting the
      # password on a command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - ${ZEDBOT_DATA_DIR:-/opt/zedbot/data}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - zedbot

  # api, bot and worker share one image built from the root Dockerfile; only
  # the command differs. Compose deduplicates the build via the shared image
  # tag.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: zedbot-app
    container_name: zedbot-api
    restart: unless-stopped
    command: ["node", "apps/api/dist/index.js"]
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports:
      # Loopback only (Phase 37): the public entrypoint is Nginx on 80/443.
      - "127.0.0.1:${API_PORT:-3000}:${API_PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${API_PORT:-3000}/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - zedbot

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: zedbot-app
    container_name: zedbot-bot
    restart: unless-stopped
    command: ["node", "apps/bot/dist/index.js"]
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zedbot

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: zedbot-app
    container_name: zedbot-worker
    restart: unless-stopped
    command: ["node", "apps/worker/dist/index.js"]
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zedbot

networks:
  zedbot:
    name: zedbot
