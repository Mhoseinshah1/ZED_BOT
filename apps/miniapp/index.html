<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>پنل کاربری</title>
    <!--
      Telegram's WebApp bridge. Not optional and not bundleable: the native
      mobile clients inject window.Telegram themselves, but Telegram Desktop
      and Telegram Web run a Mini App in an iframe where nothing is injected
      and this script is the only thing that defines it. telegram.org is the
      one third-party origin the security policy names.

      No policy meta tag lives in this document on purpose - the edge serves
      the only one. See docs/telegram-miniapp-foundation.md, section 6.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Vite rewrites this against `base` ("/miniapp/") for dev and build. -->
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
