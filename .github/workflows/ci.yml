name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Safe dummy values only - never put real tokens or passwords here.
env:
  NODE_ENV: test
  APP_NAME: ZED_BOT
  APP_DOMAIN: ci.zedbot.local
  APP_BASE_URL: "https://ci.zedbot.local"
  API_PORT: "3000"
  LOG_LEVEL: info
  TELEGRAM_BOT_TOKEN: "123456:test-token"
  ADMIN_TELEGRAM_IDS: "123456789"
  POSTGRES_DB: zedbot
  POSTGRES_USER: zedbot
  POSTGRES_PASSWORD: zedbot_test_password
  DATABASE_URL: "postgresql://zedbot:zedbot_test_password@localhost:5432/zedbot?schema=public"
  REDIS_HOST: localhost
  REDIS_PORT: "6379"
  REDIS_PASSWORD: zedbot_test_redis_password
  REDIS_URL: "redis://:zedbot_test_redis_password@localhost:6379"

jobs:
  ci:
    name: Typecheck, lint, build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zedbot
          POSTGRES_USER: zedbot
          POSTGRES_PASSWORD: zedbot_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zedbot -d zedbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack and set up pnpm
        run: |
          # corepack@latest avoids the signature-verification failures of the
          # corepack bundled with older Node releases. package.json pins the
          # exact pnpm version via the packageManager field; the first pnpm
          # invocation downloads and activates it.
          npm install -g corepack@latest
          corepack enable
          pnpm --version

      - name: Print tool versions
        run: |
          node --version
          pnpm --version
          docker --version
          docker compose version

      - name: Resolve pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Typecheck
        run: pnpm run --if-present typecheck

      - name: Lint
        run: pnpm run --if-present lint

      - name: Build
        run: pnpm run --if-present build

      - name: Apply migrations and seed against PostgreSQL
        run: |
          pnpm run db:deploy
          pnpm run db:seed
          admin_count="$(PGPASSWORD="$POSTGRES_PASSWORD" psql -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -A -c 'SELECT COUNT(*) FROM "Admin";')"
          setting_count="$(PGPASSWORD="$POSTGRES_PASSWORD" psql -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -A -c 'SELECT COUNT(*) FROM "Setting";')"
          topic_count="$(PGPASSWORD="$POSTGRES_PASSWORD" psql -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -A -c 'SELECT COUNT(*) FROM "LogTopic";')"
          template_count="$(PGPASSWORD="$POSTGRES_PASSWORD" psql -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -A -c 'SELECT COUNT(*) FROM "MessageTemplate";')"
          button_count="$(PGPASSWORD="$POSTGRES_PASSWORD" psql -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -A -c 'SELECT COUNT(*) FROM "ButtonText";')"
          echo "seeded admins: ${admin_count}, settings: ${setting_count}, log topics: ${topic_count}, templates: ${template_count}, buttons: ${button_count}"
          test "$admin_count" = "1"
          test "$setting_count" -ge 5
          test "$topic_count" -ge 13
          test "$template_count" -ge 4
          test "$button_count" -ge 16

      # PostgreSQL-backed integration tests (wallet-payment race safety and
      # anything future packages add via their own "test" script). Runs after
      # the migrate step so the job-level DATABASE_URL points at a migrated
      # database - without DATABASE_URL the DB suites would self-skip and
      # prove nothing (see docs/testing.md).
      # Redis must be up BEFORE the tests: the service-operation lock suite
      # exercises the real distributed lock (password-authenticated), and
      # the API smoke test below reuses the same instance.
      - name: Start Redis (password-protected)
        run: |
          # A plain service container cannot override the image command, and
          # the official redis image only takes its password via arguments.
          docker run -d --name ci-redis -p 6379:6379 redis:7-alpine \
            redis-server --requirepass "$REDIS_PASSWORD"
          for _ in $(seq 1 20); do
            if docker exec ci-redis redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready."
              exit 0
            fi
            sleep 1
          done
          echo "Redis did not become ready in time." >&2
          docker logs ci-redis >&2 || true
          exit 1

      - name: Run tests
        # Deployment-state tests intentionally require root-owned mode-0700
        # fixtures, matching the production contract. GitHub's runner user
        # cannot create that evidence, so run the application tests as root
        # instead of weakening ownership validation in production code.
        run: |
          ci_tool_fail() {
            printf 'CI trusted tool validation failed: %s\n' "$1" >&2
            exit 1
          }
          trusted_owner_and_mode() {
            local artifact="$1" owner mode
            owner="$(/usr/bin/stat -c '%u' -- "$artifact" 2>/dev/null)" || ci_tool_fail STAT_UNAVAILABLE
            mode="$(/usr/bin/stat -c '%a' -- "$artifact" 2>/dev/null)" || ci_tool_fail STAT_UNAVAILABLE
            { [ "$owner" = 0 ] || [ "$owner" = "$runner_uid" ]; } || ci_tool_fail OWNER_UNTRUSTED
            [ $((8#$mode & 8#022)) -eq 0 ] || ci_tool_fail MODE_WRITABLE
          }

          node_command="$(command -v node 2>/dev/null)" || ci_tool_fail NODE_MISSING
          pnpm_command="$(command -v pnpm 2>/dev/null)" || ci_tool_fail PNPM_MISSING
          case "$node_command:$pnpm_command" in
            /*:/*) ;;
            *) ci_tool_fail COMMAND_PATH_NOT_ABSOLUTE ;;
          esac
          node_bin="$(/usr/bin/dirname -- "$node_command")" || ci_tool_fail NODE_PARENT_INVALID
          tool_root="$(/usr/bin/dirname -- "$node_bin")" || ci_tool_fail TOOL_ROOT_INVALID
          case "$tool_root" in
            /opt/hostedtoolcache/node/*/x64) ;;
            *) ci_tool_fail TOOL_ROOT_UNTRUSTED ;;
          esac
          tool_version="${tool_root#/opt/hostedtoolcache/node/}"
          tool_version="${tool_version%/x64}"
          case "$tool_version" in
            ''|*/*|.|..) ci_tool_fail TOOL_ROOT_UNTRUSTED ;;
          esac
          [ "$node_command" = "$node_bin/node" ] || ci_tool_fail NODE_LOCATION_UNEXPECTED
          [ "$pnpm_command" = "$node_bin/pnpm" ] || ci_tool_fail PNPM_SHIM_LOCATION_UNEXPECTED
          [ "$(/usr/bin/realpath -e -- "$tool_root" 2>/dev/null)" = "$tool_root" ] || ci_tool_fail TOOL_ROOT_SUBSTITUTED
          [ "$(/usr/bin/realpath -e -- "$node_bin" 2>/dev/null)" = "$node_bin" ] || ci_tool_fail NODE_PARENT_SUBSTITUTED

          runner_uid="$(/usr/bin/id -u)"
          runner_gid="$(/usr/bin/id -g)"
          # actions/setup-node creates only this version root with the runner's
          # private-group umask (0775).  Harden that exact, already-validated
          # directory before root executes anything beneath it; every child
          # remains subject to the stricter non-writable validation below.
          tool_root_owner="$(/usr/bin/stat -c '%u' -- "$tool_root" 2>/dev/null)" || ci_tool_fail TOOL_ROOT_STAT_UNAVAILABLE
          tool_root_group="$(/usr/bin/stat -c '%g' -- "$tool_root" 2>/dev/null)" || ci_tool_fail TOOL_ROOT_STAT_UNAVAILABLE
          tool_root_mode="$(/usr/bin/stat -c '%a' -- "$tool_root" 2>/dev/null)" || ci_tool_fail TOOL_ROOT_STAT_UNAVAILABLE
          tool_root_inode="$(/usr/bin/stat -c '%d:%i' -- "$tool_root" 2>/dev/null)" || ci_tool_fail TOOL_ROOT_STAT_UNAVAILABLE
          [ "$tool_root_owner:$tool_root_group:$tool_root_mode" = "$runner_uid:$runner_gid:775" ] \
            || ci_tool_fail TOOL_ROOT_LAYOUT_UNEXPECTED
          sudo /usr/bin/chmod 0755 -- "$tool_root" || ci_tool_fail TOOL_ROOT_HARDEN_FAILED
          [ "$(/usr/bin/stat -c '%d:%i:%u:%g:%a' -- "$tool_root" 2>/dev/null)" = "$tool_root_inode:$runner_uid:$runner_gid:755" ] \
            || ci_tool_fail TOOL_ROOT_HARDEN_CONFIRM_FAILED
          payload="$tool_root/lib/node_modules/corepack/dist/pnpm.js"
          for trusted_dir in \
            "$tool_root" "$node_bin" "$tool_root/lib" "$tool_root/lib/node_modules" \
            "$tool_root/lib/node_modules/corepack" "$tool_root/lib/node_modules/corepack/dist"; do
            [ -d "$trusted_dir" ] && [ ! -L "$trusted_dir" ] || ci_tool_fail TRUSTED_PARENT_INVALID
            [ "$(/usr/bin/realpath -e -- "$trusted_dir" 2>/dev/null)" = "$trusted_dir" ] || ci_tool_fail TRUSTED_PARENT_SUBSTITUTED
            trusted_owner_and_mode "$trusted_dir"
          done

          [ -f "$node_command" ] && [ ! -L "$node_command" ] && [ -x "$node_command" ] || ci_tool_fail NODE_INVALID
          [ "$(/usr/bin/realpath -e -- "$node_command" 2>/dev/null)" = "$node_command" ] || ci_tool_fail NODE_SUBSTITUTED
          trusted_owner_and_mode "$node_command"

          [ -L "$pnpm_command" ] || ci_tool_fail PNPM_SHIM_NOT_SYMLINK
          shim_owner="$(/usr/bin/stat -c '%u' -- "$pnpm_command" 2>/dev/null)" || ci_tool_fail PNPM_SHIM_STAT_UNAVAILABLE
          { [ "$shim_owner" = 0 ] || [ "$shim_owner" = "$runner_uid" ]; } || ci_tool_fail PNPM_SHIM_OWNER_UNTRUSTED
          shim_target="$(/usr/bin/readlink -- "$pnpm_command" 2>/dev/null)" || ci_tool_fail PNPM_SHIM_TARGET_UNREADABLE
          [ "$shim_target" = '../lib/node_modules/corepack/dist/pnpm.js' ] || ci_tool_fail PNPM_SHIM_TARGET_UNEXPECTED
          payload_path="$(/usr/bin/realpath -e -- "$pnpm_command" 2>/dev/null)" || ci_tool_fail PNPM_PAYLOAD_MISSING
          [ "$payload_path" = "$payload" ] || ci_tool_fail PNPM_PAYLOAD_LOCATION_UNEXPECTED
          [ -f "$payload_path" ] && [ ! -L "$payload_path" ] && [ -r "$payload_path" ] || ci_tool_fail PNPM_PAYLOAD_INVALID
          trusted_owner_and_mode "$payload_path"

          sudo --preserve-env=CI,NODE_ENV,APP_NAME,APP_DOMAIN,APP_BASE_URL,API_PORT,LOG_LEVEL,TELEGRAM_BOT_TOKEN,ADMIN_TELEGRAM_IDS,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,DATABASE_URL,REDIS_HOST,REDIS_PORT,REDIS_PASSWORD,REDIS_URL \
            PATH="${node_bin}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            "$pnpm_command" test

      - name: API health smoke test
        run: |
          node apps/api/dist/index.js &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 15); do
            if curl -fsS "http://localhost:${API_PORT}/health" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          health="$(curl -fsS "http://localhost:${API_PORT}/health")"
          echo "GET /health -> ${health}"
          echo "$health" | grep -q '"ok":true'
          echo "$health" | grep -q '"database":"ok"'
          echo "$health" | grep -q '"redis":"ok"'
          version="$(curl -fsS "http://localhost:${API_PORT}/version")"
          echo "GET /version -> ${version}"
          echo "$version" | grep -q '"app":"ZED_BOT"'

      - name: Validate docker-compose.yml
        run: |
          # Compose needs a .env (env_file + interpolation); use the CI dummy
          # values, then clean up so nothing lingers on the runner.
          cat > .env <<EOF
          NODE_ENV=${NODE_ENV}
          APP_NAME=${APP_NAME}
          APP_DOMAIN=${APP_DOMAIN}
          APP_BASE_URL=${APP_BASE_URL}
          API_PORT=${API_PORT}
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          DATABASE_URL=${DATABASE_URL}
          REDIS_HOST=${REDIS_HOST}
          REDIS_PORT=${REDIS_PORT}
          REDIS_PASSWORD=${REDIS_PASSWORD}
          REDIS_URL=${REDIS_URL}
          EOF
          docker compose config --quiet
          rm -f .env
          echo "docker-compose.yml is valid."

      # scripts/restore.sh and scripts/uninstall.sh were REMOVED in Phase 36
      # (no destructive restore/uninstall); the Phase 36-38 scripts (zedbot
      # CLI, backup-db, validate-env, nginx/ssl, firewall, security-check)
      # are validated instead.
      - name: Validate bash scripts (syntax)
        run: |
          bash -n scripts/install.sh
          bash -n scripts/update.sh
          bash -n scripts/rollback.sh
          bash -n scripts/tests/application-rollback-test.sh
          bash -n scripts/backup.sh
          bash -n scripts/backup-db.sh
          bash -n scripts/doctor.sh
          bash -n scripts/migrate.sh
          bash -n scripts/validate-env.sh
          bash -n scripts/zedbot
          bash -n scripts/zedbot.sh
          bash -n scripts/nginx-setup.sh
          bash -n scripts/ssl-setup.sh
          bash -n scripts/ssl-renew.sh
          bash -n scripts/firewall-setup.sh
          bash -n scripts/security-check.sh
          bash -n scripts/lib/common.sh
          echo "All scripts parse cleanly."

      - name: ShellCheck
        run: |
          shellcheck -x -S warning -e SC1090,SC1091 \
            scripts/install.sh \
            scripts/update.sh \
            scripts/rollback.sh \
            scripts/tests/application-rollback-test.sh \
            scripts/backup.sh \
            scripts/backup-db.sh \
            scripts/doctor.sh \
            scripts/migrate.sh \
            scripts/referral-migration-preflight.sh \
            scripts/referral-migration-lineage-status.sh \
            scripts/validate-env.sh \
            scripts/zedbot \
            scripts/zedbot.sh \
            scripts/nginx-setup.sh \
            scripts/ssl-setup.sh \
            scripts/ssl-renew.sh \
            scripts/firewall-setup.sh \
            scripts/security-check.sh \
            scripts/lib/common.sh

  # Builds the production image and exercises the real backup pipeline:
  # worker creates + verifies a backup through its CLI into the shared bind
  # mount, the file persists across containers, the bot sees it read-only,
  # and no secret-shaped strings appear in any captured log.
  docker-backup-smoke:
    name: Docker backup smoke (image + worker backup pipeline)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build the app image
        run: docker build -t zedbot-app .

      - name: Runtime image ships the migration history (referral activation gate)
        run: |
          # The referral activation gate's migration-history check reads
          # packages/database/prisma/migrations FROM INSIDE the container. Prove the
          # directory and the target migration ship in the runtime image, the
          # resolver finds them, and the Prisma checksum is computable — so the gate
          # can never be permanently blocked by a missing migrations directory.
          docker run --rm zedbot-app sh -c 'test -d packages/database/prisma/migrations'
          docker run --rm zedbot-app sh -c 'test -f packages/database/prisma/migrations/20260719180000_referral_affiliate_commissions/migration.sql'
          # Resolve @zedbot/database from apps/bot — the referral activation gate lives
          # there (apps/bot/dist/services/referral-activation.service.js) and imports the
          # package, so pnpm links it under apps/bot/node_modules. A bare `node -e` eval
          # resolves specifiers relative to its cwd, so run it from the same workspace the
          # gate resolves from (running the eval from /repo would miss the un-hoisted link).
          # resolveMigrationsDir() uses import.meta.url, so it is independent of the cwd.
          docker run --rm --workdir /repo/apps/bot -e DATABASE_URL='postgresql://x:x@127.0.0.1:5432/x?schema=public' zedbot-app \
            node --input-type=module -e '
              import { resolveMigrationsDir, readPrismaMigrationChecksum, REFERRAL_AFFILIATE_MIGRATION_NAME, REFERRAL_AFFILIATE_MIGRATION_CHECKSUM_ORIGINAL } from "@zedbot/database";
              import { join } from "node:path";
              const dir = resolveMigrationsDir();
              if (!dir) { console.error("resolveMigrationsDir() returned null inside the runtime image"); process.exit(1); }
              const sum = readPrismaMigrationChecksum(join(dir, REFERRAL_AFFILIATE_MIGRATION_NAME, "migration.sql"));
              if (!/^[0-9a-f]{64}$/.test(sum)) { console.error("checksum not computable:", sum); process.exit(1); }
              if (sum !== REFERRAL_AFFILIATE_MIGRATION_CHECKSUM_ORIGINAL) { console.error("on-disk checksum drifted from the committed original:", sum); process.exit(1); }
              console.log("runtime migrations dir:", dir, "| checksum OK");
            '

      - name: Image ships PostgreSQL 16 client tools and runs as non-root
        run: |
          docker run --rm zedbot-app pg_dump --version
          docker run --rm zedbot-app pg_restore --version
          # The client major must match the postgres:16-alpine server.
          docker run --rm zedbot-app pg_dump --version | grep -E 'pg_dump \(PostgreSQL\) 16\.'
          uid="$(docker run --rm zedbot-app id -u)"
          echo "container runs as uid ${uid}"
          test "$uid" = "1000"

      - name: Prepare host backup dir, data dir and .env
        run: |
          backup_dir="$(mktemp -d)"
          data_dir="$(mktemp -d)"
          # Same ownership/mode the installer applies on a real server.
          sudo chown 1000:1000 "$backup_dir"
          sudo chmod 750 "$backup_dir"
          echo "BACKUP_HOST_DIR=${backup_dir}" >> "$GITHUB_ENV"
          echo "DATA_HOST_DIR=${data_dir}" >> "$GITHUB_ENV"
          # Dummy values only; BACKUP_ENCRYPTION_PASSWORD stays empty so the
          # produced file is a plain .dump (asserted below).
          cat > .env <<EOF
          NODE_ENV=${NODE_ENV}
          APP_NAME=${APP_NAME}
          APP_DOMAIN=${APP_DOMAIN}
          APP_BASE_URL=${APP_BASE_URL}
          API_PORT=${API_PORT}
          LOG_LEVEL=${LOG_LEVEL}
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          DATABASE_URL=postgresql://zedbot:zedbot_test_password@postgres:5432/zedbot?schema=public
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=${REDIS_PASSWORD}
          REDIS_URL=redis://:zedbot_test_redis_password@redis:6379/0
          APP_SECRET=ci-smoke-app-secret-ci-smoke-app-secret-1234
          INTERNAL_API_TOKEN=ci-smoke-internal-token-1234567890
          ZEDBOT_DATA_DIR=${data_dir}
          ZEDBOT_BACKUP_DIR=${backup_dir}
          BACKUP_RETENTION_DAYS=14
          BACKUP_MIN_RETAINED=3
          BACKUP_ENCRYPTION_PASSWORD=
          EOF

      - name: Start postgres and redis
        run: docker compose up -d --wait postgres redis

      - name: Apply database migrations (one-off container)
        run: |
          docker compose run --rm --no-deps worker \
            sh -c 'cd packages/database && node_modules/.bin/prisma migrate deploy' \
            | tee migrate.log

      - name: Create a backup via the worker CLI (into the shared mount)
        run: |
          docker compose run --rm --no-deps worker \
            node apps/worker/dist/cli/create-backup.js | tee create-backup.log

      - name: Assert dump + manifest landed on the HOST
        run: |
          sudo ls -la "$BACKUP_HOST_DIR"
          dump="$(sudo find "$BACKUP_HOST_DIR" -maxdepth 1 -name 'zedbot-db-*.dump' | head -n 1)"
          manifest="$(sudo find "$BACKUP_HOST_DIR" -maxdepth 1 -name 'zedbot-db-*.manifest.json' | head -n 1)"
          test -n "$dump"
          test -n "$manifest"
          echo "host dump: ${dump}"
          echo "host manifest: ${manifest}"

      - name: Backup persists into a FRESH worker container
        run: |
          docker compose run --rm --no-deps worker \
            sh -c 'ls -la /var/lib/zedbot/backups/ && ls /var/lib/zedbot/backups/zedbot-db-*.dump'

      - name: Bot sees the backup read-only (write must fail)
        run: |
          docker compose run --rm --no-deps bot \
            sh -c 'ls /var/lib/zedbot/backups/' | tee bot-ls.log
          grep -q 'zedbot-db-' bot-ls.log
          if docker compose run --rm --no-deps bot \
            sh -c 'touch /var/lib/zedbot/backups/.ci-write-test 2>/dev/null'; then
            echo "ERROR: the bot mount is writable but must be read-only" >&2
            exit 1
          fi
          echo "bot mount is read-only as intended."

      - name: Captured logs never contain connection strings or bot tokens
        run: |
          docker compose logs --no-color > compose.log 2>&1 || true
          cat migrate.log create-backup.log bot-ls.log compose.log > all-captured.log
          if grep -E 'postgres(ql)?://' all-captured.log; then
            echo "ERROR: a postgres:// connection string leaked into the logs" >&2
            exit 1
          fi
          if grep -E '[0-9]{6,12}:[A-Za-z0-9_-]{30,}' all-captured.log; then
            echo "ERROR: a bot-token-shaped string leaked into the logs" >&2
            exit 1
          fi
          echo "log scan clean."

      - name: Clean up
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
          rm -f .env
          sudo rm -rf "$BACKUP_HOST_DIR" "$DATA_HOST_DIR" || true

  application-rollback-smoke:
    name: "Disposable application-only rollback"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated rollback proof
        run: bash scripts/tests/application-rollback-test.sh

  # End-to-end proof that installations which predate PR #92 (persistent
  # backups) fully converge on `zedbot update`: the test installs the OLD
  # layout (code at the pre-PR92 merge, old .env, old CLI, running old
  # stack), then runs the OLD updater, which pulls THIS commit and must
  # self-heal through the scripts/migrate.sh hook - the only new-code hook
  # the legacy updater executes. Repeated 3x to prove full idempotence and
  # clean re-runs. See scripts/tests/legacy-upgrade-test.sh for the
  # assertion list (env migration, CLI refresh, forced recreation, baked
  # GIT_SHA identity, backup mounts, second update through the new path,
  # secret-leak scan).
  legacy-upgrade-smoke:
    name: "Legacy production upgrade (pre-PR92 layout, real update, 3 iterations)"
    runs-on: ubuntu-latest
    timeout-minutes: 55
    needs: []

    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@v4
        with:
          # The test checks out the pre-PR92 merge commit by SHA; a shallow
          # clone would not contain it.
          fetch-depth: 0

      - name: Run the legacy upgrade test (3 iterations)
        # Deliberately NOT `sudo -E`: the workflow-level env block exports
        # dummy POSTGRES_PASSWORD/DATABASE_URL/REDIS_* values for the unit
        # jobs, and Docker Compose gives the PROCESS environment precedence
        # over the project .env during interpolation - leaking them in would
        # initialize postgres with the workflow password while the app
        # containers read the installer-generated one from env_file (exactly
        # the P1000 auth split a real production root shell can never have).
        # Only GITHUB_SHA crosses the sudo boundary.
        run: sudo env GITHUB_SHA="${{ github.sha }}" bash scripts/tests/legacy-upgrade-test.sh --iterations 3
